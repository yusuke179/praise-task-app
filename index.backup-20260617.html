<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>秘書タスク管理</title>

<!-- iOS Safari: ホーム画面に追加対応 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="秘書タスク管理">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Sans', 'Yu Gothic UI', -apple-system, sans-serif;
    background: linear-gradient(160deg, #fff5f7 0%, #fce4ec 60%, #fff0f3 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0 0 48px;
  }

  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
  }

  /* ===== Morning button ===== */
  .morning-section {
    padding: 14px 24px 0;
  }

  .btn-morning {
    width: 100%;
    background: linear-gradient(135deg, #ffe082, #ffb74d);
    color: #7a4a00;
    border: none;
    border-radius: 28px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(255, 167, 38, 0.35);
    letter-spacing: 0.03em;
    transition: transform 0.15s, box-shadow 0.15s;
    animation: taskSlideIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .btn-morning:hover { transform: scale(1.02); box-shadow: 0 6px 18px rgba(255,167,38,0.45); }
  .btn-morning:active { transform: scale(0.97); }

  /* ===== Character Header ===== */
  .character-section {
    background: white;
    border-radius: 0 0 36px 36px;
    padding: 22px 18px 20px;
    box-shadow: 0 6px 24px rgba(255, 150, 180, 0.14);
  }

  .char-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  /* キャラクター70% / 吹き出し30% */
  .char-figure {
    flex: 0 0 70%;
    width: 70%;
  }

  .char-photo {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  .speech-bubble {
    flex: 0 0 calc(30% - 12px);
    width: calc(30% - 12px);
    background: linear-gradient(135deg, #fff5f8, #fce4ec);
    border: 2px solid #f8bbd9;
    border-radius: 16px;
    padding: 10px 10px;
    position: relative;
    box-shadow: 0 3px 12px rgba(233,30,99,0.1);
    animation: bubblePop 0.35s cubic-bezier(0.34,1.56,0.64,1);
    text-align: center;
  }

  .speech-text {
    font-size: 12px;
    line-height: 1.6;
    color: #c2185b;
    font-weight: 500;
    word-break: break-word;
  }
  .speech-text strong { color: #e91e63; font-weight: 700; }

  @media (max-width: 480px) {
    .character-section { padding: 18px 12px 16px; }
    .char-row { gap: 8px; }
    .char-figure { flex: 0 0 70%; width: 70%; }
    .speech-bubble { flex: 0 0 calc(30% - 8px); width: calc(30% - 8px); padding: 8px 8px; }
    .speech-text { font-size: 11px; line-height: 1.55; }
  }

  .char-photo.bounce {
    animation: charBounce 0.45s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes charBounce {
    0%   { transform: scale(1) translateY(0); }
    40%  { transform: scale(1.04) translateY(-5px); }
    70%  { transform: scale(0.98) translateY(2px); }
    100% { transform: scale(1) translateY(0); }
  }

  @keyframes bubblePop {
    from { opacity: 0; transform: scale(0.85) translateY(6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .speech-bubble::before {
    content: '';
    position: absolute;
    top: 50%;
    left: -11px;
    transform: translateY(-50%);
    border: 11px solid transparent;
    border-right-color: #f8bbd9;
    border-left: 0;
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    top: 50%;
    left: -8px;
    transform: translateY(-50%);
    border: 9px solid transparent;
    border-right-color: #fff5f8;
    border-left: 0;
  }

  /* ===== Progress ===== */
  .progress-section {
    padding: 20px 24px 0;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .progress-label { font-size: 13px; color: #e91e63; font-weight: 600; }
  .progress-detail { font-size: 12px; color: #f06292; }

  .progress-bar-bg {
    background: #fce4ec;
    border-radius: 10px;
    height: 12px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #f48fb1, #e91e63);
    border-radius: 10px;
    width: 0%;
    transition: width 0.55s cubic-bezier(0.4,0,0.2,1);
    position: relative;
  }
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 60%, rgba(255,255,255,0.35));
    border-radius: 10px;
  }

  /* ===== Input ===== */
  .input-section {
    padding: 18px 24px 10px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  .task-input {
    flex: 1;
    border: 2px solid #f8bbd9;
    border-radius: 28px;
    padding: 12px 20px;
    font-size: 14px;
    font-family: inherit;
    color: #444;
    outline: none;
    background: white;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .task-input:focus {
    border-color: #e91e63;
    box-shadow: 0 0 0 3px rgba(233,30,99,0.1);
  }
  .task-input::placeholder { color: #f48fb1; }

  .btn-add {
    background: linear-gradient(135deg, #f48fb1, #e91e63);
    color: white;
    border: none;
    border-radius: 28px;
    width: 48px;
    height: 48px;
    font-size: 24px;
    line-height: 1;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(233,30,99,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .btn-add:hover { transform: scale(1.08); box-shadow: 0 6px 18px rgba(233,30,99,0.4); }
  .btn-add:active { transform: scale(0.94); }

  /* ===== Tasks ===== */
  .task-section {
    padding: 10px 24px;
  }

  .section-title {
    font-size: 11px;
    color: #f06292;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-left: 2px;
  }

  .task-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .task-item {
    background: white;
    border-radius: 18px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 10px rgba(255,150,180,0.1);
    border: 1.5px solid transparent;
    transition: border-color 0.2s, background 0.2s;
    animation: taskSlideIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes taskSlideIn {
    from { opacity: 0; transform: translateY(-10px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .task-item:hover { border-color: #f8bbd9; }

  .task-item.done {
    background: linear-gradient(135deg, #fff5f8, #fce4ec);
    border-color: #f48fb1;
  }

  .task-check {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2.5px solid #f48fb1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    background: white;
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }

  .task-check:hover { border-color: #e91e63; transform: scale(1.1); }

  .task-item.done .task-check {
    background: linear-gradient(135deg, #f48fb1, #e91e63);
    border-color: #e91e63;
    transform: scale(1.05);
  }

  .task-check .check-icon { display: none; }
  .task-item.done .task-check .check-icon { display: block; }

  .task-text {
    flex: 1;
    font-size: 14px;
    line-height: 1.5;
    color: #444;
    word-break: break-word;
    transition: color 0.2s;
  }
  .task-item.done .task-text { text-decoration: line-through; color: #f06292; }

  .task-del {
    background: none;
    border: none;
    color: #f8bbd9;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 50%;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .task-del:hover { color: #e91e63; background: #fce4ec; }

  .empty-msg {
    text-align: center;
    color: #f8bbd9;
    font-size: 14px;
    padding: 28px 0;
  }

  /* ===== Schedule ===== */
  .schedule-section {
    padding: 10px 24px;
  }

  .btn-schedule-toggle {
    width: 100%;
    background: white;
    color: #e91e63;
    border: 2px dashed #f8bbd9;
    border-radius: 28px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 10px;
  }
  .btn-schedule-toggle:hover { background: #fff5f8; border-color: #e91e63; }

  .schedule-form {
    display: none;
    flex-direction: column;
    gap: 8px;
    background: white;
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 2px 10px rgba(255,150,180,0.12);
    margin-bottom: 10px;
    animation: taskSlideIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .schedule-form.open { display: flex; }

  .form-row { display: flex; gap: 8px; }
  .form-row > * { flex: 1; }

  .sch-input {
    border: 2px solid #f8bbd9;
    border-radius: 14px;
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
    color: #444;
    outline: none;
    background: white;
    width: 100%;
    min-width: 0;
    transition: border-color 0.2s;
  }
  .sch-input:focus { border-color: #e91e63; }
  .sch-input::placeholder { color: #f48fb1; }

  .btn-sch-save {
    background: linear-gradient(135deg, #f48fb1, #e91e63);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(233,30,99,0.25);
    transition: transform 0.15s;
  }
  .btn-sch-save:hover { transform: scale(1.03); }

  .btn-sch-cancel {
    background: white;
    color: #f06292;
    border: 2px solid #f8bbd9;
    border-radius: 20px;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-sch-cancel:hover { background: #fff5f8; border-color: #e91e63; }

  .schedule-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .schedule-item {
    background: white;
    border-radius: 18px;
    padding: 12px 14px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    box-shadow: 0 2px 10px rgba(255,150,180,0.1);
    border: 1.5px solid transparent;
    transition: border-color 0.2s;
    animation: taskSlideIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .schedule-item:hover { border-color: #f8bbd9; }
  .schedule-item.today-item {
    border-color: #f48fb1;
    background: linear-gradient(135deg, #fff5f8, #fce4ec);
  }
  .schedule-item.past { opacity: 0.55; }

  .sch-info { flex: 1; min-width: 0; }
  .sch-when { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .sch-date {
    font-size: 11px;
    font-weight: 700;
    color: #f06292;
    background: #fce4ec;
    border-radius: 10px;
    padding: 2px 9px;
    flex-shrink: 0;
  }
  .sch-date.is-today {
    background: linear-gradient(135deg, #f48fb1, #e91e63);
    color: white;
  }
  .sch-time { font-size: 13px; font-weight: 700; color: #e91e63; }
  .sch-title { font-size: 14px; color: #444; font-weight: 600; word-break: break-word; }
  .sch-memo { font-size: 12px; color: #999; margin-top: 2px; word-break: break-word; }

  .sch-edit, .sch-del {
    background: none;
    border: none;
    cursor: pointer;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 50%;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .sch-edit { color: #f48fb1; font-size: 15px; }
  .sch-edit:hover { color: #e91e63; background: #fce4ec; }
  .sch-del { color: #f8bbd9; font-size: 18px; }
  .sch-del:hover { color: #e91e63; background: #fce4ec; }

  /* ===== End button ===== */
  .end-section {
    padding: 14px 24px 0;
  }

  .btn-end {
    width: 100%;
    background: white;
    color: #e91e63;
    border: 2px solid #f8bbd9;
    border-radius: 28px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }
  .btn-end:hover { background: #fff5f8; border-color: #e91e63; box-shadow: 0 3px 10px rgba(233,30,99,0.12); }

  /* ===== Lifetime stats ===== */
  .lifetime-section {
    padding: 18px 24px 0;
  }

  .lifetime-card {
    background: white;
    border-radius: 24px;
    padding: 20px 22px;
    box-shadow: 0 4px 16px rgba(255,150,180,0.12);
    text-align: center;
  }

  .lifetime-label {
    display: block;
    font-size: 12px;
    color: #f06292;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  .lifetime-count {
    display: block;
    font-size: 32px;
    font-weight: 800;
    color: #e91e63;
    line-height: 1.3;
    margin-bottom: 12px;
  }
  .lifetime-count .unit { font-size: 15px; font-weight: 600; margin-left: 2px; }

  .event-bar-bg {
    background: #fce4ec;
    border-radius: 10px;
    height: 14px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .event-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffd54f, #ffb300);
    border-radius: 10px;
    width: 0%;
    transition: width 0.55s cubic-bezier(0.4,0,0.2,1);
    position: relative;
  }
  .event-bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 60%, rgba(255,255,255,0.4));
    border-radius: 10px;
  }

  .event-remain {
    display: block;
    font-size: 12px;
    color: #f06292;
    font-weight: 500;
  }
  .event-remain strong { color: #e91e63; font-weight: 700; }

  .footer-note {
    text-align: center;
    color: #f8bbd9;
    font-size: 11px;
    margin-top: 18px;
    padding: 0 24px;
  }

  /* ===== Confetti ===== */
  .confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 90;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute;
    top: -30px;
    animation: confettiFall linear forwards;
    user-select: none;
  }

  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(110vh) rotate(900deg) scale(0.5); opacity: 0; }
  }

  /* ===== Modal (end-of-day / event) ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 200, 220, 0.45);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    animation: overlayIn 0.3s ease;
  }

  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: white;
    border-radius: 32px;
    padding: 36px 28px 32px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 64px rgba(233,30,99,0.2);
    animation: modalPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
  }

  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.75) translateY(24px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-photo {
    width: 180px;
    height: auto;
    margin: 0 auto 18px;
    display: block;
  }

  .modal-msg {
    font-size: 16px;
    font-weight: 600;
    color: #c2185b;
    line-height: 1.75;
    margin-bottom: 22px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 26px;
  }

  .stat-card {
    background: linear-gradient(135deg, #fff5f8, #fce4ec);
    border: 1.5px solid #fce4ec;
    border-radius: 18px;
    padding: 14px 6px;
  }

  .stat-num {
    display: block;
    font-size: 26px;
    font-weight: 800;
    color: #e91e63;
    line-height: 1.2;
  }

  .stat-lbl {
    display: block;
    font-size: 10px;
    color: #f06292;
    line-height: 1.5;
    margin-top: 3px;
  }

  .btn-modal-ok {
    background: linear-gradient(135deg, #f48fb1, #e91e63);
    color: white;
    border: none;
    border-radius: 28px;
    padding: 15px 36px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(233,30,99,0.3);
    letter-spacing: 0.03em;
    transition: transform 0.15s;
  }
  .btn-modal-ok:hover { transform: scale(1.04); }

  /* イベントモーダル(ゴールド調) */
  .modal.event-modal {
    box-shadow: 0 24px 64px rgba(255,160,0,0.3);
    border: 2px solid #ffd54f;
  }
  .event-modal .modal-msg { color: #b26a00; }
  .event-modal .btn-modal-ok {
    background: linear-gradient(135deg, #ffd54f, #ffb300);
    color: #7a4a00;
    box-shadow: 0 5px 18px rgba(255,160,0,0.35);
  }
  .event-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ffd54f, #ffb300);
    color: #7a4a00;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    border-radius: 14px;
    padding: 5px 16px;
    margin-bottom: 14px;
  }
</style>
</head>
<body>

<div class="app">

  <!-- おはようボタン -->
  <div class="morning-section" id="morningSection" style="display:none">
    <button class="btn-morning" id="morningBtn">☀️ おはようございます</button>
  </div>

  <!-- キャラクター -->
  <div class="character-section">
    <div class="char-row">
      <div class="char-figure">
        <img src="normal.png" alt="秘書キャラクター" class="char-photo" id="charPhoto">
      </div>
      <div class="speech-bubble" id="speechBubble">
        <p class="speech-text" id="speechText"></p>
      </div>
    </div>
  </div>

  <!-- 進捗 -->
  <div class="progress-section">
    <div class="progress-header">
      <span class="progress-label">今日の進捗</span>
      <span class="progress-detail" id="progressDetail">0 / 0 完了</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- 入力 -->
  <div class="input-section">
    <div class="input-row">
      <input type="text" class="task-input" id="taskInput"
             placeholder="タスクを入力して Enter または ＋" maxlength="100">
      <button class="btn-add" id="addBtn" title="追加">＋</button>
    </div>
  </div>

  <!-- タスク一覧 -->
  <div class="task-section">
    <div class="section-title">タスク一覧</div>
    <ul class="task-list" id="taskList"></ul>
    <p class="empty-msg" id="emptyMsg">タスクを追加してみましょう♪</p>
  </div>

  <!-- 予定 -->
  <div class="schedule-section">
    <div class="section-title">予定</div>

    <button class="btn-schedule-toggle" id="scheduleToggleBtn">＋ 予定を追加</button>

    <div class="schedule-form" id="scheduleForm">
      <div class="form-row">
        <input type="date" class="sch-input" id="schDate">
        <input type="time" class="sch-input" id="schTime">
      </div>
      <input type="text" class="sch-input" id="schTitle" placeholder="予定名（例：会議）" maxlength="50">
      <input type="text" class="sch-input" id="schMemo" placeholder="メモ（任意）" maxlength="200">
      <div class="form-row">
        <button class="btn-sch-save" id="schSaveBtn">保存</button>
        <button class="btn-sch-cancel" id="schCancelBtn">キャンセル</button>
      </div>
    </div>

    <ul class="schedule-list" id="scheduleList"></ul>
    <p class="empty-msg" id="scheduleEmptyMsg">予定はまだありません</p>
  </div>

  <!-- 終了ボタン -->
  <div class="end-section">
    <button class="btn-end" id="endBtn">今日はこれで終了</button>
  </div>

  <!-- 累計達成タスク数 -->
  <div class="lifetime-section">
    <div class="lifetime-card">
      <span class="lifetime-label">累計達成タスク数</span>
      <span class="lifetime-count"><span id="lifetimeCount">0</span><span class="unit">件</span></span>
      <div class="event-bar-bg">
        <div class="event-bar-fill" id="eventBarFill"></div>
      </div>
      <span class="event-remain" id="eventRemain"></span>
    </div>
  </div>

  <p class="footer-note">入力内容はブラウザに自動保存されます（このパソコン・このブラウザのみ）</p>

</div>

<!-- 紙吹雪レイヤー -->
<div class="confetti-layer" id="confettiLayer"></div>

<!-- 終了モーダル -->
<div class="modal-overlay" id="modal" style="display:none">
  <div class="modal">
    <img src="tired.png" alt="秘書キャラクター" class="modal-photo">
    <p class="modal-msg" id="modalMsg">今日もお疲れさまでした😊</p>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-num" id="statRate">0%</span>
        <span class="stat-lbl">今日の<br>達成率</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statDone">0</span>
        <span class="stat-lbl">完了<br>タスク数</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statRemain">0</span>
        <span class="stat-lbl">明日へ<br>繰越</span>
      </div>
    </div>

    <button class="btn-modal-ok" id="modalOkBtn">また明日も頑張ろう♪</button>
  </div>
</div>

<!-- イベントモーダル -->
<div class="modal-overlay" id="eventModal" style="display:none">
  <div class="modal event-modal">
    <span class="event-badge" id="eventBadge">🎉 50件達成</span>
    <img src="event50.png" alt="お祝いキャラクター" class="modal-photo" id="eventPhoto">
    <p class="modal-msg" id="eventMsg"></p>
    <button class="btn-modal-ok" id="eventOkBtn">ありがとう♪</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
   * 設定（キャラクター・イベント・メッセージはここで一元管理）
   *
   * 別キャラクター（ツンデレ上司版・妹キャラ版など）を作る場合は
   * CHARACTERS に新しい定義を追加し、ACTIVE_CHARACTER を切り替える。
   * 画像・状態・イベント・セリフはすべて設定データで完結する。
   * ========================================================= */

  const CHARACTERS = {
    secretary: {
      name: '秘書',
      // 状態遷移順: morning → normal → support → cheer → perfect → tired
      states: {
        morning: {
          image: 'morning.png',
          messages: [
            'おはようございます☀️',
            '今日はどんな一日にしましょうか？',
            '無理せずいきましょうね♪',
            '今日も無理せず頑張りましょう♪',
            '小さな一歩でも前進です😊',
          ],
        },
        normal: {
          image: 'normal.png',
          messages: [
            '今日もおつかれさまです♪',
            '一緒に進めていきましょう😊',
            '今日のタスクを追加してみましょう！',
          ],
        },
        support: {
          image: 'support.png',
          messages: [
            '無理せず進めてくださいね☕',
            '焦らなくても大丈夫ですよ♪',
            'いいペースですよ😊',
          ],
        },
        cheer: {
          image: 'happy.png',
          messages: [
            'あと少しです✨',
            '頑張ってくださいね💪',
            'その調子ですよ〜😊',
          ],
        },
        perfect: {
          image: 'perfect.png',
          messages: [
            '全タスク完了です🎉',
            '本当に素晴らしいです✨',
            '100点満点です！🎉',
          ],
        },
        tired: {
          image: 'tired.png',
          messages: [
            '今日もお疲れさまでした🌙',
            '残りは明日に回しましょうね',
            'ゆっくり休んでください♪',
          ],
        },
      },
      // 今日の予定を知らせるセリフ（{time}・{title} が置換される）
      scheduleMessages: [
        '今日は{time}から{title}が入ってますよっ❤️',
        '{time}から{title}ですね。忘れないようにしましょう😊',
        '今日は予定がありますよ♪ {time}から{title}です',
      ],
      // タスクを1件完了したときのセリフ
      taskDoneMessages: [
        'いい感じです♪',
        'その調子です😊',
        '一つ終わりましたね、えらいです✨',
      ],
      // 累計達成数イベント（count の昇順で定義する）
      events: [
        {
          count: 50,
          image: 'event50.png',
          messages: [
            '50タスク達成おめでとうございます🎉',
            '小さな積み重ねって素敵ですね♪',
          ],
        },
        { count: 100,  image: 'special.png', messages: ['100タスク達成おめでとうございます♪'] },
        { count: 200,  image: 'special.png', messages: ['もう200件ですね😊'] },
        { count: 300,  image: 'special.png', messages: ['本当に頑張っていますね♪'] },
        { count: 500,  image: 'special.png', messages: ['私、とても誇らしいです✨'] },
        { count: 1000, image: 'special.png', messages: ['ここまで続けられる人はなかなかいません♪'] },
      ],
      endModalMessage: '今日はここまでですね😊<br>残りのタスクは明日に繰り越しておきます♪<br>お疲れさまでした💕',
    },
  };

  const ACTIVE_CHARACTER = 'secretary';
  const CHAR = CHARACTERS[ACTIVE_CHARACTER];

  /* =========================================================
   * 状態判定（達成率 → 状態名）
   * ========================================================= */
  function resolveStateName(ctx) {
    if (ctx.endFlag) return 'tired';
    if (ctx.total === 0) return ctx.isFirstOpenToday ? 'morning' : 'normal';
    if (ctx.pct === 100) return 'perfect';
    if (ctx.pct >= 80) return 'cheer';
    if (ctx.pct >= 50) return 'support';
    return 'normal';
  }

  /* =========================================================
   * 永続化
   * 既存キーをそのまま使い、新フィールドは未定義なら初期化する
   * （既存ユーザーのデータを引き継ぐ）
   * ========================================================= */
  const STORAGE_KEY = 'secretaryTaskApp.v3';

  let tasks = [];
  let schedules = [];  // { id, date: 'YYYY-MM-DD', time: 'HH:MM', title, memo }
  let endFlag = false;
  let lastEndDate = null;
  let lastOpenDate = null;
  let isFirstOpenToday = false;
  let totalDone = 0;          // 累計達成タスク数
  let shownEvents = [];       // 表示済みイベントの count 一覧
  let lastMorningDate = null; // おはようボタンを押した日

  // 午前5:00を1日の開始時刻とする。
  // 0:00〜4:59 はまだ「前日」として扱い、5:00を過ぎたら新しい1日になる。
  // 繰り越し・初回起動・おはよう判定はすべてこの「論理日」を基準にする。
  function todayStr() {
    const d = new Date();
    if (d.getHours() < 5) {
      d.setDate(d.getDate() - 1); // 月またぎ・年またぎも自動補正される
    }
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        tasks, schedules, endFlag, lastEndDate, lastOpenDate,
        totalDone, shownEvents, lastMorningDate,
      }));
    } catch(e) {}
  }

  function load() {
    try {
      const d = localStorage.getItem(STORAGE_KEY);
      if (d) {
        const p = JSON.parse(d);
        if (Array.isArray(p.tasks)) tasks = p.tasks;
        if (Array.isArray(p.schedules)) schedules = p.schedules;
        endFlag = !!p.endFlag;
        lastEndDate = p.lastEndDate || null;
        lastOpenDate = p.lastOpenDate || null;
        lastMorningDate = p.lastMorningDate || null;
        shownEvents = Array.isArray(p.shownEvents) ? p.shownEvents : [];
        if (typeof p.totalDone === 'number') {
          totalDone = p.totalDone;
        } else {
          // 旧データからの移行: 現在完了済みのタスク数を初期値にする
          totalDone = tasks.filter(t => t.done).length;
        }
      }
    } catch(e) {
      tasks = []; schedules = []; endFlag = false; lastEndDate = null; lastOpenDate = null;
      totalDone = 0; shownEvents = []; lastMorningDate = null;
    }

    if (lastEndDate && lastEndDate !== todayStr()) {
      endFlag = false;
      tasks = tasks.filter(t => !t.done);
    }

    isFirstOpenToday = lastOpenDate !== todayStr();
    lastOpenDate = todayStr();
    save();
  }

  /* =========================================================
   * DOM
   * ========================================================= */
  const taskInput    = document.getElementById('taskInput');
  const addBtn       = document.getElementById('addBtn');
  const taskListEl   = document.getElementById('taskList');
  const emptyMsg     = document.getElementById('emptyMsg');
  const progressFill = document.getElementById('progressFill');
  const progressDet  = document.getElementById('progressDetail');
  const speechText   = document.getElementById('speechText');
  const speechBubble = document.getElementById('speechBubble');
  const charPhoto    = document.getElementById('charPhoto');
  const endBtn       = document.getElementById('endBtn');
  const modal        = document.getElementById('modal');
  const modalMsg     = document.getElementById('modalMsg');
  const modalOkBtn   = document.getElementById('modalOkBtn');
  const confettiLayer= document.getElementById('confettiLayer');
  const morningSection = document.getElementById('morningSection');
  const morningBtn   = document.getElementById('morningBtn');
  const lifetimeCount= document.getElementById('lifetimeCount');
  const eventBarFill = document.getElementById('eventBarFill');
  const eventRemain  = document.getElementById('eventRemain');
  const eventModal   = document.getElementById('eventModal');
  const eventBadge   = document.getElementById('eventBadge');
  const eventPhoto   = document.getElementById('eventPhoto');
  const eventMsg     = document.getElementById('eventMsg');
  const eventOkBtn   = document.getElementById('eventOkBtn');
  const scheduleToggleBtn = document.getElementById('scheduleToggleBtn');
  const scheduleForm  = document.getElementById('scheduleForm');
  const schDate       = document.getElementById('schDate');
  const schTime       = document.getElementById('schTime');
  const schTitle      = document.getElementById('schTitle');
  const schMemo       = document.getElementById('schMemo');
  const schSaveBtn    = document.getElementById('schSaveBtn');
  const schCancelBtn  = document.getElementById('schCancelBtn');
  const scheduleList  = document.getElementById('scheduleList');
  const scheduleEmptyMsg = document.getElementById('scheduleEmptyMsg');

  function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

  function setSpeech(html) {
    speechText.innerHTML = html;
    speechBubble.style.animation = 'none';
    void speechBubble.offsetWidth;
    speechBubble.style.animation = 'bubblePop 0.35s cubic-bezier(0.34,1.56,0.64,1)';
  }

  function bounceChar() {
    charPhoto.classList.remove('bounce');
    void charPhoto.offsetWidth;
    charPhoto.classList.add('bounce');
    setTimeout(() => charPhoto.classList.remove('bounce'), 500);
  }

  function updateProgress() {
    const total = tasks.length;
    const done  = tasks.filter(t => t.done).length;
    const pct   = total === 0 ? 0 : Math.round(done / total * 100);
    progressFill.style.width = pct + '%';
    progressDet.textContent  = `${done} / ${total} 完了`;
    return { total, done, pct };
  }

  /* =========================================================
   * キャラクター表示
   * 状態が変わったときだけランダムでセリフを引き直す
   * ========================================================= */
  let currentState = null;

  function updateCharacter(force) {
    const { total, pct } = updateProgress();
    const stateName = resolveStateName({ endFlag, total, pct, isFirstOpenToday });
    const state = CHAR.states[stateName];
    if (!state) return;

    charPhoto.src = state.image;
    if (force || stateName !== currentState) {
      setSpeech(rand(state.messages));
      currentState = stateName;
    }
  }

  function showStateNow(stateName) {
    const state = CHAR.states[stateName];
    if (!state) return;
    charPhoto.src = state.image;
    setSpeech(rand(state.messages));
    currentState = stateName;
    bounceChar();
  }

  /* =========================================================
   * 累計達成数・次イベントまでの進捗
   * ========================================================= */
  function updateLifetime() {
    lifetimeCount.textContent = totalDone;

    const thresholds = CHAR.events.map(ev => ev.count);
    const next = thresholds.find(c => c > totalDone);

    if (next === undefined) {
      eventBarFill.style.width = '100%';
      eventRemain.innerHTML = 'すべてのイベントを達成しました🎉';
      return;
    }

    let prev = 0;
    for (const c of thresholds) {
      if (c <= totalDone) prev = c;
    }
    const pct = Math.round((totalDone - prev) / (next - prev) * 100);
    eventBarFill.style.width = pct + '%';
    eventRemain.innerHTML = `次のイベントまで <strong>あと${next - totalDone}件</strong>`;
  }

  /* =========================================================
   * イベント（初回到達時のみ表示）
   * ========================================================= */
  function checkEvents() {
    const reached = CHAR.events.filter(ev => totalDone >= ev.count && !shownEvents.includes(ev.count));
    if (reached.length === 0) return;

    // 複数同時到達時は最大のものを表示し、すべて表示済みにする
    const ev = reached[reached.length - 1];
    reached.forEach(r => shownEvents.push(r.count));
    save();

    eventBadge.textContent = `🎉 ${ev.count}件達成`;
    eventPhoto.src = ev.image;
    eventMsg.innerHTML = ev.messages.join('<br>');
    eventModal.style.display = 'flex';
    shootConfetti();
  }

  function closeEventModal() {
    eventModal.style.display = 'none';
    stopConfetti();
    updateCharacter(true);
  }

  eventOkBtn.addEventListener('click', closeEventModal);
  eventModal.addEventListener('click', e => { if (e.target === eventModal) closeEventModal(); });

  /* =========================================================
   * おはようボタン
   * 午前5:00を1日の開始とし、5:00を過ぎて初めて開いた日に表示する。
   * 「今日はこれで終了」を押したかどうかに関係なく、
   * 翌日5:00を過ぎたら再び表示する（lastMorningDate と論理日を比較）。
   * 同じ日に一度押したら（lastMorningDate === todayStr()）再表示しない。
   * ========================================================= */
  function updateMorningButton() {
    const show = lastMorningDate !== todayStr();
    morningSection.style.display = show ? 'block' : 'none';
  }

  morningBtn.addEventListener('click', () => {
    lastMorningDate = todayStr();
    save();
    updateMorningButton();
    showStateNow('morning');
    // 朝の挨拶のあと、今日の予定があれば知らせる
    if (todaysSchedules().length > 0) {
      setTimeout(announceTodaySchedules, 2200);
    }
  });

  /* =========================================================
   * 予定（スケジュール）
   * ========================================================= */
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // 日付入力(YYYY-MM-DD)と比較するためのゼロ埋め版today
  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // '15:00' → '15時' / '15:30' → '15時30分'
  function fmtTime(t) {
    const [h, m] = t.split(':');
    return parseInt(m, 10) === 0 ? `${parseInt(h,10)}時` : `${parseInt(h,10)}時${parseInt(m,10)}分`;
  }

  function fmtDate(iso) {
    if (iso === todayISO()) return '今日';
    const [y, mo, da] = iso.split('-').map(Number);
    const wd = ['日','月','火','水','木','金','土'][new Date(y, mo-1, da).getDay()];
    return `${mo}/${da}(${wd})`;
  }

  function todaysSchedules() {
    return schedules
      .filter(s => s.date === todayISO())
      .sort((a, b) => a.time.localeCompare(b.time));
  }

  // 今日の予定を吹き出しで知らせる
  function announceTodaySchedules() {
    const list = todaysSchedules();
    if (list.length === 0) return;
    const s = list[0];
    let msg = rand(CHAR.scheduleMessages)
      .replace('{time}', `<strong>${fmtTime(s.time)}</strong>`)
      .replace('{title}', `<strong>${escHtml(s.title)}</strong>`);
    if (list.length > 1) msg += `<br>ほか${list.length - 1}件の予定があります📝`;
    setSpeech(msg);
    bounceChar();
  }

  let editingScheduleId = null;

  function openScheduleForm(sched) {
    scheduleForm.classList.add('open');
    scheduleToggleBtn.style.display = 'none';
    if (sched) {
      editingScheduleId = sched.id;
      schDate.value  = sched.date;
      schTime.value  = sched.time;
      schTitle.value = sched.title;
      schMemo.value  = sched.memo || '';
      schSaveBtn.textContent = '更新';
    } else {
      editingScheduleId = null;
      schDate.value  = todayISO();
      schTime.value  = '';
      schTitle.value = '';
      schMemo.value  = '';
      schSaveBtn.textContent = '保存';
    }
  }

  function closeScheduleForm() {
    scheduleForm.classList.remove('open');
    scheduleToggleBtn.style.display = 'block';
    editingScheduleId = null;
  }

  function renderSchedules() {
    schedules.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    scheduleList.innerHTML = '';
    scheduleEmptyMsg.style.display = schedules.length === 0 ? 'block' : 'none';
    const today = todayISO();

    schedules.forEach(s => {
      const li = document.createElement('li');
      li.className = 'schedule-item'
        + (s.date === today ? ' today-item' : (s.date < today ? ' past' : ''));
      li.innerHTML = `
        <div class="sch-info">
          <div class="sch-when">
            <span class="sch-date${s.date === today ? ' is-today' : ''}">${fmtDate(s.date)}</span>
            <span class="sch-time">${s.time}</span>
          </div>
          <div class="sch-title">${escHtml(s.title)}</div>
          ${s.memo ? `<div class="sch-memo">${escHtml(s.memo)}</div>` : ''}
        </div>
        <button class="sch-edit" data-id="${s.id}" title="編集">✎</button>
        <button class="sch-del" data-id="${s.id}" title="削除">×</button>
      `;
      scheduleList.appendChild(li);
    });
  }

  function saveSchedule() {
    const date  = schDate.value;
    const time  = schTime.value;
    const title = schTitle.value.trim();
    const memo  = schMemo.value.trim();

    if (!date || !time || !title) {
      setSpeech('日付・時間・予定名を入力してくださいね😊');
      return;
    }

    if (editingScheduleId) {
      const s = schedules.find(s => s.id === editingScheduleId);
      if (s) { s.date = date; s.time = time; s.title = title; s.memo = memo; }
    } else {
      schedules.push({ id: makeId(), date, time, title, memo });
    }

    save();
    renderSchedules();
    closeScheduleForm();

    if (date === todayISO()) {
      announceTodaySchedules();
    } else {
      setSpeech(`${fmtDate(date)} ${fmtTime(time)}の<strong>${escHtml(title)}</strong>、登録しました♪`);
    }
  }

  function deleteSchedule(id) {
    schedules = schedules.filter(s => s.id !== id);
    if (editingScheduleId === id) closeScheduleForm();
    save();
    renderSchedules();
  }

  scheduleToggleBtn.addEventListener('click', () => openScheduleForm(null));
  schSaveBtn.addEventListener('click', saveSchedule);
  schCancelBtn.addEventListener('click', closeScheduleForm);

  scheduleList.addEventListener('click', e => {
    const edit = e.target.closest('.sch-edit');
    const del  = e.target.closest('.sch-del');
    if (edit) {
      const s = schedules.find(s => s.id === edit.dataset.id);
      if (s) openScheduleForm(s);
    } else if (del) {
      deleteSchedule(del.dataset.id);
    }
  });

  /* =========================================================
   * タスク描画・操作
   * ========================================================= */

  function render() {
    taskListEl.innerHTML = '';
    emptyMsg.style.display = tasks.length === 0 ? 'block' : 'none';

    tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task-item' + (task.done ? ' done' : '');

      li.innerHTML = `
        <div class="task-check" data-id="${task.id}">
          <svg class="check-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 7L5.5 10.5L12 3.5" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="task-text">${escHtml(task.text)}</span>
        <button class="task-del" data-id="${task.id}" title="削除">×</button>
      `;
      taskListEl.appendChild(li);
    });

    updateProgress();
    updateCharacter();
    updateLifetime();
    updateMorningButton();
    renderSchedules();
  }

  function addTask(text) {
    const t = text.trim();
    if (!t) return;
    tasks.push({ id: makeId(), text: t, done: false });
    save();
    render();
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    const wasDone = task.done;
    task.done = !task.done;

    if (!wasDone && task.done) {
      totalDone++;
    } else if (wasDone && !task.done) {
      totalDone = Math.max(0, totalDone - 1);
    }

    save();
    render();

    if (!wasDone && task.done) {
      bounceChar();
      const { done, total } = updateProgress();
      if (done === total && total > 0) {
        shootConfetti();
      } else {
        // 全完了時は perfect 状態のセリフを優先する
        setSpeech(rand(CHAR.taskDoneMessages));
      }
      checkEvents();
    }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  taskListEl.addEventListener('click', e => {
    const check = e.target.closest('.task-check');
    const del   = e.target.closest('.task-del');
    if (check) toggleTask(check.dataset.id);
    else if (del) deleteTask(del.dataset.id);
  });

  addBtn.addEventListener('click', () => {
    addTask(taskInput.value);
    taskInput.value = '';
    taskInput.focus();
  });

  taskInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      addTask(taskInput.value);
      taskInput.value = '';
    }
  });

  /* =========================================================
   * 終了ボタン・モーダル
   * ========================================================= */
  endBtn.addEventListener('click', () => {
    const { done, total, pct } = updateProgress();
    const remain = total - done;

    document.getElementById('statRate').textContent   = pct + '%';
    document.getElementById('statDone').textContent   = done;
    document.getElementById('statRemain').textContent = remain;

    endFlag = true;
    lastEndDate = todayStr();
    save();
    updateCharacter(true);
    updateMorningButton();

    modalMsg.innerHTML = CHAR.endModalMessage;
    modal.style.display = 'flex';
  });

  modalOkBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  function closeModal() {
    modal.style.display = 'none';
    stopConfetti();
  }

  /* =========================================================
   * 紙吹雪
   * ========================================================= */
  let confettiTimer = null;

  function shootConfetti() {
    stopConfetti();
    const symbols = ['❤️','💕','✨','🌸','💖','⭐','💗','🌟','🎀','💫'];
    let count = 0;

    function burst() {
      for (let i = 0; i < 6; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.fontSize = (14 + Math.random() * 16) + 'px';
        const dur = 1.6 + Math.random() * 1.8;
        el.style.animationDuration = dur + 's';
        el.style.animationDelay = Math.random() * 0.4 + 's';
        confettiLayer.appendChild(el);
        setTimeout(() => el.remove(), (dur + 0.6) * 1000);
      }
      count++;
      if (count < 8) confettiTimer = setTimeout(burst, 350);
    }
    burst();
  }

  function stopConfetti() {
    if (confettiTimer) { clearTimeout(confettiTimer); confettiTimer = null; }
    confettiLayer.innerHTML = '';
  }

  load();
  render();

  // アプリを開いたとき、今日の予定があれば秘書が知らせる
  if (!endFlag && todaysSchedules().length > 0) {
    setTimeout(announceTodaySchedules, 700);
  }
})();
</script>
</body>
</html>
