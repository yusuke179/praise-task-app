<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fff5f8"/>
      <stop offset="100%" stop-color="#ffd9e8"/>
    </radialGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a26bd1"/>
      <stop offset="100%" stop-color="#7a4fb5"/>
    </linearGradient>
    <linearGradient id="hairShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#caa6ec" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#caa6ec" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景円 -->
  <circle cx="120" cy="120" r="118" fill="url(#bgGrad)"/>

  <!-- 後ろ髪 -->
  <path d="M120 38
           C 70 38 48 86 52 142
           C 54 176 64 206 78 224
           L 78 150
           C 78 150 92 168 120 168
           C 148 168 162 150 162 150
           L 162 224
           C 176 206 186 176 188 142
           C 192 86 170 38 120 38 Z" fill="url(#hairGrad)"/>

  <!-- 首 -->
  <rect x="106" y="150" width="28" height="34" rx="10" fill="#ffe1c9"/>

  <!-- 顔 -->
  <ellipse cx="120" cy="118" rx="52" ry="56" fill="#ffe9d6"/>

  <!-- 頬の赤み -->
  <ellipse cx="92" cy="134" rx="10" ry="6" fill="#ffb6c8" opacity="0.7"/>
  <ellipse cx="148" cy="134" rx="10" ry="6" fill="#ffb6c8" opacity="0.7"/>

  <!-- 眉 -->
  <path d="M96 100 q10 -7 20 -2" stroke="#7a4fb5" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M124 98 q10 -5 20 2" stroke="#7a4fb5" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 目（アニメ風の大きな瞳） -->
  <g>
    <ellipse cx="103" cy="116" rx="9" ry="12" fill="#ffffff"/>
    <ellipse cx="103" cy="118" rx="8" ry="11" fill="#8a5fd1"/>
    <circle cx="103" cy="115" r="4.2" fill="#3a2768"/>
    <circle cx="100.5" cy="112" r="2.2" fill="#ffffff"/>
  </g>
  <g>
    <ellipse cx="138" cy="116" rx="9" ry="12" fill="#ffffff"/>
    <ellipse cx="138" cy="118" rx="8" ry="11" fill="#8a5fd1"/>
    <circle cx="138" cy="115" r="4.2" fill="#3a2768"/>
    <circle cx="135.5" cy="112" r="2.2" fill="#ffffff"/>
  </g>

  <!-- まつ毛 -->
  <path d="M94 110 q9 -6 18 -1" stroke="#5b3b94" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M128 109 q9 -5 18 1" stroke="#5b3b94" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 鼻 -->
  <path d="M120 124 q3 4 0 7" stroke="#e8b894" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 口（やさしい微笑み） -->
  <path d="M110 142 q10 9 20 0" stroke="#d9707f" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 前髪 -->
  <path d="M120 50
           C 92 50 76 70 74 96
           C 86 84 102 78 120 78
           C 138 78 154 84 166 96
           C 164 70 148 50 120 50 Z" fill="url(#hairGrad)"/>
  <path d="M82 92 C 90 78 104 70 120 70 C 100 74 88 84 82 96 Z" fill="url(#hairShine)"/>

  <!-- サイドの髪の束 -->
  <path d="M70 96 C 64 124 66 158 80 188 C 76 156 76 124 80 100 Z" fill="#9466c8"/>
  <path d="M170 96 C 176 124 174 158 160 188 C 164 156 164 124 160 100 Z" fill="#9466c8"/>

  <!-- リボン -->
  <g transform="translate(150,84) rotate(18)">
    <path d="M0 0 L14 -8 L14 8 Z" fill="#ff8fab"/>
    <path d="M0 0 L-14 -8 L-14 8 Z" fill="#ff8fab"/>
    <circle cx="0" cy="0" r="4" fill="#ff5c8a"/>
  </g>
</svg>
