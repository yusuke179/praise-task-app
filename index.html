<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>秘書タスク管理</title>

<!-- iOS Safari: ホーム画面に追加対応 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="秘書タスク管理">
<link rel="apple-touch-icon" href="normal.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Sans', 'Yu Gothic UI', -apple-system, sans-serif;
    background: linear-gradient(160deg, #fff5f7 0%, #fce4ec 60%, #fff0f3 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0 0 48px;
  }

  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
  }

  /* ===== Character Header ===== */
  .character-section {
    background: white;
    border-radius: 0 0 36px 36px;
    padding: 28px 28px 24px;
    box-shadow: 0 6px 24px rgba(255, 150, 180, 0.14);
  }

  .char-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }

  .char-figure {
    flex-shrink: 0;
  }

  .char-photo {
    width: 260px;
    height: auto;
    display: block;
    object-fit: contain;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  @media (max-width: 480px) {
    .char-row {
      flex-direction: column;
    }
    .char-photo { width: 180px; }
  }

  .char-photo.bounce {
    animation: charBounce 0.45s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes charBounce {
    0%   { transform: scale(1) translateY(0); }
    40%  { transform: scale(1.04) translateY(-5px); }
    70%  { transform: scale(0.98) translateY(2px); }
    100% { transform: scale(1) translateY(0); }
  }

  .speech-bubble {
    flex: 1;
    background: linear-gradient(135deg, #fff5f8, #fce4ec);
    border: 2px solid #f8bbd9;
    border-radius: 20px;
    padding: 14px 18px;
    position: relative;
    box-shadow: 0 3px 12px rgba(233,30,99,0.1);
    animation: bubblePop 0.35s cubic-bezier(0.34,1.56,0.64,1);
    text-align: center;
  }

  @keyframes bubblePop {
    from { opacity: 0; transform: scale(0.85) translateY(6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .speech-bubble::before {
    content: '';
    position: absolute;
    top: 50%;
    left: -11px;
    transform: translateY(-50%);
    border: 11px solid transparent;
    border-right-color: #f8bbd9;
    border-left: 0;
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    top: 50%;
    left: -8px;
    transform: translateY(-50%);
    border: 9px solid transparent;
    border-right-color: #fff5f8;
    border-left: 0;
  }

  @media (max-width: 480px) {
    .speech-bubble::before {
      top: -11px; left: 50%;
      transform: translateX(-50%);
      border-right-color: transparent;
      border-bottom-color: #f8bbd9;
      border-top: 0;
    }
    .speech-bubble::after {
      top: -8px; left: 50%;
      transform: translateX(-50%);
      border-right-color: transparent;
      border-bottom-color: #fff5f8;
      border-top: 0;
    }
  }

  .speech-text {
    font-size: 14px;
    line-height: 1.75;
    color: #c2185b;
    font-weight: 500;
  }
  .speech-text strong { color: #e91e63; font-weight: 700; }

  /* ===== Progress ===== */
  .progress-section {
    padding: 20px 24px 0;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .progress-label { font-size: 13px; color: #e91e63; font-weight: 600; }
  .progress-detail { font-size: 12px; color: #f06292; }

  .progress-bar-bg {
    background: #fce4ec;
    border-radius: 10px;
    height: 12px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #f48fb1, #e91e63);
    border-radius: 10px;
    width: 0%;
    transition: width 0.55s cubic-bezier(0.4,0,0.2,1);
    position: relative;
  }
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 60%, rgba(255,255,255,0.35));
    border-radius: 10px;
  }

  /* ===== Input ===== */
  .input-section {
    padding: 18px 24px 10px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  .task-input {
    flex: 1;
    border: 2px solid #f8bbd9;
    border-radius: 28px;
    padding: 12px 20px;
    font-size: 14px;
    font-family: inherit;
    color: #444;
    outline: none;
    background: white;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .task-input:focus {
    border-color: #e91e63;
    box-shadow: 0 0 0 3px rgba(233,30,99,0.1);
  }
  .task-input::placeholder { color: #f48fb1; }

  .btn-add {
    background: linear-gradient(135deg, #f48fb1, #e91e63);
    color: white;
    border: none;
    border-radius: 28px;
    width: 48px;
    height: 48px;
    font-size: 24px;
    line-height: 1;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(233,30,99,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .btn-add:hover { transform: scale(1.08); box-shadow: 0 6px 18px rgba(233,30,99,0.4); }
  .btn-add:active { transform: scale(0.94); }

  /* ===== Tasks ===== */
  .task-section {
    padding: 10px 24px;
  }

  .section-title {
    font-size: 11px;
    color: #f06292;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-left: 2px;
  }

  .task-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .task-item {
    background: white;
    border-radius: 18px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 10px rgba(255,150,180,0.1);
    border: 1.5px solid transparent;
    transition: border-color 0.2s, background 0.2s;
    animation: taskSlideIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes taskSlideIn {
    from { opacity: 0; transform: translateY(-10px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .task-item:hover { border-color: #f8bbd9; }

  .task-item.done {
    background: linear-gradient(135deg, #fff5f8, #fce4ec);
    border-color: #f48fb1;
  }

  .task-check {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2.5px solid #f48fb1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    background: white;
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }

  .task-check:hover { border-color: #e91e63; transform: scale(1.1); }

  .task-item.done .task-check {
    background: linear-gradient(135deg, #f48fb1, #e91e63);
    border-color: #e91e63;
    transform: scale(1.05);
  }

  .task-check .check-icon { display: none; }
  .task-item.done .task-check .check-icon { display: block; }

  .task-text {
    flex: 1;
    font-size: 14px;
    line-height: 1.5;
    color: #444;
    word-break: break-word;
    transition: color 0.2s;
  }
  .task-item.done .task-text { text-decoration: line-through; color: #f06292; }

  .task-del {
    background: none;
    border: none;
    color: #f8bbd9;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 50%;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .task-del:hover { color: #e91e63; background: #fce4ec; }

  .empty-msg {
    text-align: center;
    color: #f8bbd9;
    font-size: 14px;
    padding: 28px 0;
  }

  /* ===== End button ===== */
  .end-section {
    padding: 14px 24px 0;
  }

  .btn-end {
    width: 100%;
    background: white;
    color: #e91e63;
    border: 2px solid #f8bbd9;
    border-radius: 28px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }
  .btn-end:hover { background: #fff5f8; border-color: #e91e63; box-shadow: 0 3px 10px rgba(233,30,99,0.12); }

  .footer-note {
    text-align: center;
    color: #f8bbd9;
    font-size: 11px;
    margin-top: 18px;
    padding: 0 24px;
  }

  /* ===== Confetti ===== */
  .confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 90;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute;
    top: -30px;
    animation: confettiFall linear forwards;
    user-select: none;
  }

  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(110vh) rotate(900deg) scale(0.5); opacity: 0; }
  }

  /* ===== End-of-day Modal ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 200, 220, 0.45);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    animation: overlayIn 0.3s ease;
  }

  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: white;
    border-radius: 32px;
    padding: 36px 28px 32px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 64px rgba(233,30,99,0.2);
    animation: modalPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
  }

  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.75) translateY(24px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-photo {
    width: 180px;
    height: auto;
    margin: 0 auto 18px;
    display: block;
  }

  .modal-msg {
    font-size: 16px;
    font-weight: 600;
    color: #c2185b;
    line-height: 1.75;
    margin-bottom: 22px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 26px;
  }

  .stat-card {
    background: linear-gradient(135deg, #fff5f8, #fce4ec);
    border: 1.5px solid #fce4ec;
    border-radius: 18px;
    padding: 14px 6px;
  }

  .stat-num {
    display: block;
    font-size: 26px;
    font-weight: 800;
    color: #e91e63;
    line-height: 1.2;
  }

  .stat-lbl {
    display: block;
    font-size: 10px;
    color: #f06292;
    line-height: 1.5;
    margin-top: 3px;
  }

  .btn-modal-ok {
    background: linear-gradient(135deg, #f48fb1, #e91e63);
    color: white;
    border: none;
    border-radius: 28px;
    padding: 15px 36px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(233,30,99,0.3);
    letter-spacing: 0.03em;
    transition: transform 0.15s;
  }
  .btn-modal-ok:hover { transform: scale(1.04); }
</style>
</head>
<body>

<div class="app">

  <!-- キャラクター -->
  <div class="character-section">
    <div class="char-row">
      <div class="char-figure">
        <img src="normal.png" alt="秘書キャラクター" class="char-photo" id="charPhoto">
      </div>
      <div class="speech-bubble" id="speechBubble">
        <p class="speech-text" id="speechText">
          今日のタスクを追加してみましょう！<br>
          <strong>一緒に頑張りましょう♪</strong>
        </p>
      </div>
    </div>
  </div>

  <!-- 進捗 -->
  <div class="progress-section">
    <div class="progress-header">
      <span class="progress-label">今日の進捗</span>
      <span class="progress-detail" id="progressDetail">0 / 0 完了</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- 入力 -->
  <div class="input-section">
    <div class="input-row">
      <input type="text" class="task-input" id="taskInput"
             placeholder="タスクを入力して Enter または ＋" maxlength="100">
      <button class="btn-add" id="addBtn" title="追加">＋</button>
    </div>
  </div>

  <!-- タスク一覧 -->
  <div class="task-section">
    <div class="section-title">タスク一覧</div>
    <ul class="task-list" id="taskList"></ul>
    <p class="empty-msg" id="emptyMsg">タスクを追加してみましょう♪</p>
  </div>

  <!-- 終了ボタン -->
  <div class="end-section">
    <button class="btn-end" id="endBtn">今日はこれで終了</button>
  </div>

  <p class="footer-note">入力内容はブラウザに自動保存されます（このパソコン・このブラウザのみ）</p>

</div>

<!-- 紙吹雪レイヤー -->
<div class="confetti-layer" id="confettiLayer"></div>

<!-- 終了モーダル -->
<div class="modal-overlay" id="modal" style="display:none">
  <div class="modal">
    <img src="tired.png" alt="秘書キャラクター" class="modal-photo">
    <p class="modal-msg" id="modalMsg">今日もお疲れさまでした😊</p>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-num" id="statRate">0%</span>
        <span class="stat-lbl">今日の<br>達成率</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statDone">0</span>
        <span class="stat-lbl">完了<br>タスク数</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statRemain">0</span>
        <span class="stat-lbl">明日へ<br>繰越</span>
      </div>
    </div>

    <button class="btn-modal-ok" id="modalOkBtn">また明日も頑張ろう♪</button>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'secretaryTaskApp.v3';

  let tasks = [];
  let endFlag = false;
  let lastEndDate = null;
  let lastOpenDate = null;
  let isFirstOpenToday = false;

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }

  const taskInput    = document.getElementById('taskInput');
  const addBtn       = document.getElementById('addBtn');
  const taskListEl   = document.getElementById('taskList');
  const emptyMsg     = document.getElementById('emptyMsg');
  const progressFill = document.getElementById('progressFill');
  const progressDet  = document.getElementById('progressDetail');
  const speechText   = document.getElementById('speechText');
  const speechBubble = document.getElementById('speechBubble');
  const charPhoto    = document.getElementById('charPhoto');
  const endBtn       = document.getElementById('endBtn');
  const modal        = document.getElementById('modal');
  const modalMsg     = document.getElementById('modalMsg');
  const modalOkBtn   = document.getElementById('modalOkBtn');
  const confettiLayer= document.getElementById('confettiLayer');

  const MSG_MORNING = 'おはようございます☀<br><strong>今日も無理せず頑張りましょう♪</strong>';

  const MSG_NORMAL = '今日のタスクを追加してみましょう！<br><strong>一緒に頑張りましょう♪</strong>';

  const MSG_HAPPY = 'いい感じです♪<br><strong>その調子ですよ〜😊</strong>';

  const MSG_PERFECT = '100点満点です！🎉<br><strong>今日もお疲れさまでした♪</strong>';

  const MSG_COMPLETE = '全部終わりましたね！<br><strong>さすがです〜✨</strong><br>今日もお疲れさまでした💕';

  const MSG_TIRED = '今日はここまでですね😊<br>残りのタスクは明日に繰り越しておきます♪<br>お疲れさまでした💕';

  function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks, endFlag, lastEndDate, lastOpenDate }));
    } catch(e) {}
  }
  function load() {
    try {
      const d = localStorage.getItem(STORAGE_KEY);
      if (d) {
        const p = JSON.parse(d);
        if (Array.isArray(p.tasks)) tasks = p.tasks;
        endFlag = !!p.endFlag;
        lastEndDate = p.lastEndDate || null;
        lastOpenDate = p.lastOpenDate || null;
      }
    } catch(e) { tasks = []; endFlag = false; lastEndDate = null; lastOpenDate = null; }

    if (lastEndDate && lastEndDate !== todayStr()) {
      endFlag = false;
      tasks = tasks.filter(t => !t.done);
    }

    isFirstOpenToday = lastOpenDate !== todayStr();
    lastOpenDate = todayStr();
    save();
  }

  function setSpeech(html) {
    speechText.innerHTML = html;
    speechBubble.style.animation = 'none';
    void speechBubble.offsetWidth;
    speechBubble.style.animation = 'bubblePop 0.35s cubic-bezier(0.34,1.56,0.64,1)';
  }

  function bounceChar() {
    charPhoto.classList.remove('bounce');
    void charPhoto.offsetWidth;
    charPhoto.classList.add('bounce');
    setTimeout(() => charPhoto.classList.remove('bounce'), 500);
  }

  function updateProgress() {
    const total = tasks.length;
    const done  = tasks.filter(t => t.done).length;
    const pct   = total === 0 ? 0 : Math.round(done / total * 100);
    progressFill.style.width = pct + '%';
    progressDet.textContent  = `${done} / ${total} 完了`;
    return { total, done, pct };
  }

  function render() {
    taskListEl.innerHTML = '';
    emptyMsg.style.display = tasks.length === 0 ? 'block' : 'none';

    tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task-item' + (task.done ? ' done' : '');

      li.innerHTML = `
        <div class="task-check" data-id="${task.id}">
          <svg class="check-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 7L5.5 10.5L12 3.5" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="task-text">${escHtml(task.text)}</span>
        <button class="task-del" data-id="${task.id}" title="削除">×</button>
      `;
      taskListEl.appendChild(li);
    });

    updateProgress();
    updateCharacter();
  }

  function updateCharacter() {
    if (endFlag) {
      charPhoto.src = 'tired.png';
      setSpeech(MSG_TIRED);
      return;
    }
    const { total, done, pct } = updateProgress();
    if (total === 0) {
      if (isFirstOpenToday) {
        charPhoto.src = 'morning.png';
        setSpeech(MSG_MORNING);
      } else {
        charPhoto.src = 'normal.png';
        setSpeech(MSG_NORMAL);
      }
    } else if (pct === 100) {
      charPhoto.src = 'perfect.png';
      setSpeech(MSG_PERFECT);
    } else if (pct >= 50) {
      charPhoto.src = 'happy.png';
      setSpeech(MSG_HAPPY);
    } else {
      charPhoto.src = 'normal.png';
      setSpeech(MSG_NORMAL);
    }
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function addTask(text) {
    const t = text.trim();
    if (!t) return;
    tasks.push({ id: makeId(), text: t, done: false });
    save();
    render();
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    const wasDone = task.done;
    task.done = !task.done;
    save();
    render();

    if (!wasDone && task.done) {
      bounceChar();
      const { done, total } = updateProgress();
      if (done === total && total > 0) shootConfetti();
    }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  taskListEl.addEventListener('click', e => {
    const check = e.target.closest('.task-check');
    const del   = e.target.closest('.task-del');
    if (check) toggleTask(check.dataset.id);
    else if (del) deleteTask(del.dataset.id);
  });

  addBtn.addEventListener('click', () => {
    addTask(taskInput.value);
    taskInput.value = '';
    taskInput.focus();
  });

  taskInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      addTask(taskInput.value);
      taskInput.value = '';
    }
  });

  endBtn.addEventListener('click', () => {
    const { done, total, pct } = updateProgress();
    const remain = total - done;

    document.getElementById('statRate').textContent   = pct + '%';
    document.getElementById('statDone').textContent   = done;
    document.getElementById('statRemain').textContent = remain;

    endFlag = true;
    lastEndDate = todayStr();
    save();
    updateCharacter();

    modalMsg.innerHTML = MSG_TIRED;
    modal.style.display = 'flex';
  });

  modalOkBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  function closeModal() {
    modal.style.display = 'none';
    stopConfetti();
  }

  let confettiTimer = null;

  function shootConfetti() {
    stopConfetti();
    const symbols = ['❤️','💕','✨','🌸','💖','⭐','💗','🌟','🎀','💫'];
    let count = 0;

    function burst() {
      for (let i = 0; i < 6; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.fontSize = (14 + Math.random() * 16) + 'px';
        const dur = 1.6 + Math.random() * 1.8;
        el.style.animationDuration = dur + 's';
        el.style.animationDelay = Math.random() * 0.4 + 's';
        confettiLayer.appendChild(el);
        setTimeout(() => el.remove(), (dur + 0.6) * 1000);
      }
      count++;
      if (count < 8) confettiTimer = setTimeout(burst, 350);
    }
    burst();
  }

  function stopConfetti() {
    if (confettiTimer) { clearTimeout(confettiTimer); confettiTimer = null; }
    confettiLayer.innerHTML = '';
  }

  load();
  render();
})();
</script>
</body>
</html>
